services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV_DEPS: "1"
    env_file:
      - .env.example
      - .env.test
    environment:
      APP_ENV: test
    volumes:
      - ./config/jwt:/run/my_app-secrets/jwt:ro
    depends_on:
      db:
        condition: service_healthy
      mercure:
        condition: service_started
      mailpit:
        condition: service_started

  db:
    image: mysql:8.4
    command: ["mysqld", "--sql-mode="]
    environment:
      MYSQL_DATABASE: my_app_test
      MYSQL_USER: my_app
      MYSQL_PASSWORD: my_app
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mercure:
    image: dunglas/mercure:v0.18
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "change-me"
      MERCURE_SUBSCRIBER_JWT_KEY: "change-me"
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        subscriptions

  mailpit:
    image: axllent/mailpit:latest

monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - http
        - messenger

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            http:
                type: stream
                path: "%kernel.logs_dir%/http.log"
                level: info
                channels: ["http"]
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger.log"
                level: info
                channels: ["messenger"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            http:
                type: stream
                path: "%kernel.logs_dir%/http.log"
                level: info
                channels: ["http"]
            messenger:
                type: stream
                path: "%kernel.logs_dir%/messenger.log"
                level: info
                channels: ["messenger"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            http:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: ["http"]
            messenger:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: ["messenger"]

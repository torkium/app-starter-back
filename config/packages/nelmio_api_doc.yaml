nelmio_api_doc:
    documentation:
        info:
            title: My App Back API
            description: My App Back API Symfony DDD centree sur User avec JWT, outbox, Mercure et Stripe.
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)

# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: [ 'x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix' ]
    http_client: true
    serializer:
        enabled: true
    session:
        enabled: true
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    rate_limiter:
        auth_login:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        auth_register:
            policy: sliding_window
            limit: 3
            interval: '10 minutes'
        auth_forgot_password:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        auth_sensitive:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        webhook:
            policy: token_bucket
            limit: 30
            rate: { interval: '1 minute', amount: 30 }
        media_upload:
            policy: token_bucket
            limit: 20
            rate: { interval: '1 minute', amount: 20 }

when@test:
    framework:
        test: true
        rate_limiter:
            auth_login:
                policy: no_limit
            auth_register:
                policy: no_limit
            auth_forgot_password:
                policy: no_limit
            auth_sensitive:
                policy: no_limit
            webhook:
                policy: no_limit
            media_upload:
                policy: no_limit

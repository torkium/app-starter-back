security:
    password_hashers:
        App\Identity\Domain\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Identity\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/(health|doc|doc\.json), roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(register|login|refresh|confirm-email|forgot-password|reset-password), roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/billing/plans, roles: PUBLIC_ACCESS }
        - { path: ^/api/legal-documents, roles: PUBLIC_ACCESS }
        - { path: ^/api/media/uploads/.+/binary$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Identity\Domain\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
